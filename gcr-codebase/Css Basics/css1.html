<!DOCTYPE html>
<html>
<head>
     <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Tangerine">
<style>
    body{
        font-family:  'Tangerine', serif;
    }
/* Type Selector */
h1 { color: navy; }
/* Class Selector */
.highlight { background-color: yellow; }
/* ID Selector */
#header { font-size: 24px; }
/* Descendant Selector */
div p { color: green; }
/* Pseudo-class */
a:hover { color: red; }
/* Pseudo-element */
p::first-letter { font-size: 2em; font-weight: bold; }
.zbg{
    font-family:  'Tangerine', serif;
}
</style>
</head>
<body>
<h1 id="header">Welcome To The BridgeLabz</h1>
<div>
<p class="highlight">This is a highlighted paragraph inside div.</p>
</div>
    <a href="#">Hover over me!</a>
     <p class="zbg">This paragraph has a styled first letter.</p
</body>
</html>
